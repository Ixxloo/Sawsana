<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#172A2A">
<title>Sawsana — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--sand:#E8D8BD;--deep:#172A2A;--terra:#A85C3B;--stone:#C9B99A;--white:#FCF9F2;--ink:#122020;--muted:#6C7773;--gold:#CFB277;--shadow:0 35px 110px rgba(0,0,0,.38);--ease:cubic-bezier(.22,.61,.36,1)}
*{box-sizing:border-box}html,body{min-height:100%}body{margin:0;font-family:"DM Sans",sans-serif;color:var(--ink);background:radial-gradient(circle at 15% 15%,rgba(207,178,119,.22),transparent 28%),radial-gradient(circle at 85% 78%,rgba(168,92,59,.24),transparent 30%),linear-gradient(135deg,#172A2A 0%,#223735 48%,#3a2a22 100%);display:grid;place-items:center;padding:28px;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.09;background-image:linear-gradient(45deg,transparent 42%,#fff 43% 48%,transparent 49% 61%,#fff 62% 67%,transparent 68%),linear-gradient(-45deg,transparent 42%,#fff 43% 48%,transparent 49% 61%,#fff 62% 67%,transparent 68%);background-size:42px 42px}
.shell{position:relative;z-index:1;width:min(1050px,100%);min-height:620px;display:grid;grid-template-columns:1.05fr .95fr;border-radius:34px;overflow:hidden;background:var(--white);box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.16)}
.art{position:relative;display:flex;align-items:center;justify-content:center;min-height:620px;padding:44px;background:linear-gradient(160deg,#E8D8BD 0%,#f4ead8 55%,#d8c2a0 100%);overflow:hidden}
.art:before{content:"";position:absolute;inset:0;opacity:.13;background:linear-gradient(45deg,transparent 42%,#9f1f1f 43% 48%,transparent 49% 61%,#9f1f1f 62% 67%,transparent 68%),linear-gradient(-45deg,transparent 42%,#fff 43% 48%,transparent 49% 61%,#fff 62% 67%,transparent 68%);background-size:35px 35px;mask-image:linear-gradient(120deg,#000,transparent 78%)}
.art:after{content:"";position:absolute;width:360px;height:360px;border-radius:50%;background:rgba(168,92,59,.13);left:-130px;bottom:-140px}
.visual{position:relative;z-index:2;width:min(440px,94%);text-align:center}.greeting{font-family:Tahoma,"DM Sans",sans-serif;font-size:clamp(3.4rem,7vw,5.9rem);font-weight:900;line-height:1;color:var(--deep);margin:0 0 12px;letter-spacing:-.045em;direction:rtl}.sticker{width:100%;max-height:420px;object-fit:contain;filter:drop-shadow(0 24px 34px rgba(23,42,42,.18));animation:float 4.5s ease-in-out infinite}.caption{margin:16px auto 0;max-width:420px;color:#52605c;font-size:.93rem;line-height:1.7}
.panel{display:flex;align-items:center;padding:54px 48px;background:var(--white)}.box{width:100%;max-width:410px;margin:auto}.brand{display:flex;align-items:center;gap:10px;margin-bottom:30px;font-weight:900;letter-spacing:.08em;color:var(--deep)}.brandmark{width:34px;height:34px;border-radius:50%;background:var(--terra);box-shadow:inset 0 0 0 8px #fff,0 5px 16px rgba(168,92,59,.25)}
h1{font-family:"Cormorant Garamond",serif;font-size:3.25rem;line-height:.95;margin:0 0 10px;color:var(--deep)}.sub{color:var(--muted);margin:0 0 26px;line-height:1.65}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;border-radius:999px;background:#eee4d3;margin-bottom:22px}.tab{border:0;border-radius:999px;padding:11px 14px;background:transparent;color:#61706b;font-weight:800;cursor:pointer;transition:.25s}.tab.active{background:var(--deep);color:#fff;box-shadow:0 8px 20px rgba(23,42,42,.18)}
.field{display:grid;gap:7px;margin-bottom:14px}.field label{font-size:.83rem;font-weight:800;color:#3c4a46}.field input{width:100%;padding:13px 15px;border:1px solid #dacdb8;border-radius:15px;background:#fffaf2;color:var(--ink);font:inherit}.field input:focus{outline:none;border-color:var(--terra);box-shadow:0 0 0 4px rgba(168,92,59,.14)}
.btn{width:100%;border:0;border-radius:999px;padding:13px 18px;font:800 1rem "DM Sans",sans-serif;cursor:pointer;transition:.28s var(--ease)}.primary{margin-top:8px;background:var(--terra);color:white;box-shadow:0 12px 35px rgba(168,92,59,.28)}.primary:hover{transform:translateY(-2px);box-shadow:0 16px 42px rgba(168,92,59,.38)}.divider{display:flex;align-items:center;gap:12px;color:#8b948f;font-size:.78rem;margin:18px 0}.divider:before,.divider:after{content:"";height:1px;flex:1;background:#e1d5c3}.google{border:1px solid #d9cdbb;background:#fff;color:var(--deep);display:flex;align-items:center;justify-content:center;gap:10px}.google:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(23,42,42,.12)}.google b{font-size:1.2rem;color:var(--terra)}.guest{margin-top:10px;background:transparent;color:var(--muted)}.guest:hover{color:var(--terra)}.status{min-height:22px;margin:12px 0 0;font-size:.82rem;color:#a64c36;line-height:1.5}.status.ok{color:#315f52}.back{display:inline-flex;margin-top:18px;color:var(--muted);font-size:.82rem;text-decoration:none;font-weight:800}.back:hover{color:var(--terra)}button:disabled{opacity:.55;cursor:not-allowed}
@keyframes float{50%{transform:translateY(-8px)}}
@media(max-width:850px){body{padding:14px}.shell{grid-template-columns:1fr}.art{min-height:300px;padding:28px}.sticker{max-height:255px}.caption{display:none}.panel{padding:38px 26px}.greeting{font-size:3.7rem;margin-bottom:6px}}
@media(max-width:520px){.shell{border-radius:26px}.art{min-height:250px}.panel{padding:30px 20px}h1{font-size:2.65rem}.sticker{max-height:210px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="shell">
  <section class="art" aria-label="Jordanian welcome illustration">
    <div class="visual">
      <div class="greeting">قوّكم</div>
      <img class="sticker" src="sawsana_login_sticker_transparent.png" alt="Jordanian welcome characters">
      <p class="caption">A Jordanian welcome into Sawsana — routes, stories, culture and the places you want to remember.</p>
    </div>
  </section>
  <section class="panel">
    <div class="box">
      <div class="brand"><span class="brandmark"></span><span>SAWSANA</span></div>
      <h1 id="title">Welcome back.</h1>
      <p class="sub" id="sub">Sign in to save your Jordan plans, favourites and community profile.</p>
      <div class="tabs" role="tablist">
        <button class="tab active" id="loginTab" type="button">Log in</button>
        <button class="tab" id="signupTab" type="button">Create account</button>
      </div>
      <form id="authForm">
        <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com" required></div>
        <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" minlength="6" placeholder="At least 6 characters" required></div>
        <button class="btn primary" id="submitBtn" type="submit">Log in</button>
      </form>
      <div class="divider">or</div>
      <button class="btn google" id="googleBtn" type="button"><b>G</b> Continue with Google</button>
      <button class="btn guest" id="guestBtn" type="button">Continue as guest</button>
      <p class="status" id="status" role="status"></p>
      <a class="back" href="index.html">← Back to Sawsana</a>
    </div>
  </section>
</main>
<script src="firebase-config.js"></script>
<script type="module">
import {initializeApp,getApps,getApp} from 'https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js';
import {getAuth,setPersistence,browserLocalPersistence,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,GoogleAuthProvider,signInWithPopup} from 'https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js';
const cfg=window.SAWSANA_FIREBASE_CONFIG||{};
const status=document.getElementById('status'),form=document.getElementById('authForm'),email=document.getElementById('email'),password=document.getElementById('password'),submitBtn=document.getElementById('submitBtn'),googleBtn=document.getElementById('googleBtn');
let mode='login',auth=null;
function setMode(m){mode=m;const signup=m==='signup';document.getElementById('loginTab').classList.toggle('active',!signup);document.getElementById('signupTab').classList.toggle('active',signup);document.getElementById('title').textContent=signup?'Create your Sawsana account.':'Welcome back.';document.getElementById('sub').textContent=signup?'Save routes, favourites and your community identity across devices.':'Sign in to save your Jordan plans, favourites and community profile.';submitBtn.textContent=signup?'Create account':'Log in';password.autocomplete=signup?'new-password':'current-password';status.textContent='';}
document.getElementById('loginTab').onclick=()=>setMode('login');document.getElementById('signupTab').onclick=()=>setMode('signup');
function friendly(e){const c=e?.code||'';return ({'auth/invalid-credential':'Email or password is incorrect.','auth/email-already-in-use':'This email already has an account. Try logging in.','auth/weak-password':'Use a password with at least 6 characters.','auth/invalid-email':'Enter a valid email address.','auth/popup-closed-by-user':'Google sign-in was closed before it finished.','auth/operation-not-allowed':'Enable this sign-in method in Firebase Authentication.','auth/network-request-failed':'Check your internet connection and try again.','auth/unauthorized-domain':'Add this domain in Firebase Authentication → Settings → Authorized domains.'})[c]||'Could not sign in. Please try again.';}
function goSite(){localStorage.removeItem('sawsana_guest');location.replace('index.html');}
if(!cfg.apiKey||!cfg.authDomain||!cfg.projectId||!cfg.appId){status.textContent='Add your Firebase web config in firebase-config.js. Guest mode already works.';submitBtn.disabled=true;googleBtn.disabled=true;}else{
  try{const app=getApps().length?getApp():initializeApp(cfg);auth=getAuth(app);await setPersistence(auth,browserLocalPersistence);onAuthStateChanged(auth,user=>{if(user&&!user.isAnonymous)goSite();});}
  catch(e){status.textContent='Firebase could not connect. Check firebase-config.js.';submitBtn.disabled=true;googleBtn.disabled=true;}
}
form.addEventListener('submit',async e=>{e.preventDefault();if(!auth)return;status.className='status';status.textContent='Connecting…';submitBtn.disabled=true;try{if(mode==='signup')await createUserWithEmailAndPassword(auth,email.value.trim(),password.value);else await signInWithEmailAndPassword(auth,email.value.trim(),password.value);status.className='status ok';status.textContent=mode==='signup'?'Account created. Opening Sawsana…':'Welcome back. Opening Sawsana…';goSite();}catch(err){status.textContent=friendly(err);submitBtn.disabled=false;}});
googleBtn.onclick=async()=>{if(!auth)return;status.className='status';status.textContent='Opening Google…';try{await signInWithPopup(auth,new GoogleAuthProvider());goSite();}catch(err){status.textContent=friendly(err);}};
document.getElementById('guestBtn').onclick=()=>{localStorage.setItem('sawsana_guest','1');location.replace('index.html');};
</script>
</body>
</html>
