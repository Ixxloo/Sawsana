<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#172A2A">
<meta name="robots" content="noindex">
<title>Sawsana — Log out</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--sand:#E8D8BD;--deep:#172A2A;--terra:#A85C3B;--white:#FCF9F2;--ink:#122020;--muted:#6C7773;--shadow:0 35px 110px rgba(0,0,0,.38);--ease:cubic-bezier(.22,.61,.36,1)}
*{box-sizing:border-box}html,body{min-height:100%}
body{margin:0;font-family:"DM Sans",sans-serif;color:var(--ink);background:radial-gradient(circle at 15% 15%,rgba(207,178,119,.22),transparent 28%),radial-gradient(circle at 85% 78%,rgba(168,92,59,.24),transparent 30%),linear-gradient(135deg,#172A2A 0%,#223735 48%,#3a2a22 100%);display:grid;place-items:center;padding:28px;min-height:100vh}
.card{width:min(440px,100%);background:var(--white);border-radius:30px;padding:44px 38px;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.16);text-align:center}
.brand{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:26px;font-weight:900;letter-spacing:.08em;color:var(--deep)}
.brandmark{width:34px;height:34px;border-radius:50%;background:var(--terra);box-shadow:inset 0 0 0 8px #fff,0 5px 16px rgba(168,92,59,.25)}
h1{font-family:"Cormorant Garamond",serif;font-size:2.9rem;line-height:1;margin:0 0 10px;color:var(--deep)}
.sub{color:var(--muted);margin:0 0 6px;line-height:1.6}
.who{display:inline-block;margin:8px 0 26px;padding:8px 16px;border-radius:999px;background:#eee4d3;color:var(--deep);font-weight:700;font-size:.9rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{display:block;width:100%;border:0;border-radius:999px;padding:13px 18px;font:800 1rem "DM Sans",sans-serif;cursor:pointer;text-decoration:none;transition:.28s var(--ease)}
.primary{background:var(--terra);color:#fff;box-shadow:0 12px 35px rgba(168,92,59,.28)}.primary:hover{transform:translateY(-2px);box-shadow:0 16px 42px rgba(168,92,59,.38)}
.ghost{margin-top:10px;background:transparent;color:var(--muted)}.ghost:hover{color:var(--terra)}
.status{min-height:22px;margin:14px 0 0;font-size:.82rem;color:#a64c36}.status.ok{color:#315f52}
button:disabled{opacity:.55;cursor:not-allowed}
/* Hidden until we know the visitor is signed in — prevents any flash for signed-out visitors */
#gate{display:none}
#checking{color:#e8d8bd;font-weight:600}
</style>
</head>
<body>
<p id="checking" role="status">Checking your session…</p>
<main class="card" id="gate">
  <div class="brand"><span class="brandmark"></span><span>SAWSANA</span></div>
  <h1 id="title">Log out?</h1>
  <p class="sub" id="sub">You're signed in as</p>
  <div class="who" id="who"></div>
  <button class="btn primary" id="logoutBtn" type="button">Log out</button>
  <a class="btn ghost" id="stayBtn" href="index.html">Stay signed in</a>
  <p class="status" id="status" role="status"></p>
</main>
<noscript><p style="color:#fff">JavaScript is required.</p></noscript>
<script src="firebase-config.js"></script>
<script type="module">
import {initializeApp,getApps,getApp} from 'https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js';
import {getAuth,setPersistence,browserLocalPersistence,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js';
const cfg=window.SAWSANA_FIREBASE_CONFIG||{};
const gate=document.getElementById('gate'),checking=document.getElementById('checking'),status=document.getElementById('status'),btn=document.getElementById('logoutBtn');
let signingOut=false;
const toLogin=()=>location.replace('login.html');

if(!cfg.apiKey||!cfg.authDomain||!cfg.projectId||!cfg.appId){toLogin();}
else{
  try{
    const app=getApps().length?getApp():initializeApp(cfg);
    const auth=getAuth(app);
    await setPersistence(auth,browserLocalPersistence);
    onAuthStateChanged(auth,user=>{
      if(signingOut)return;
      // Only real (non-guest/anonymous) signed-in users may see this page
      if(!user||user.isAnonymous){toLogin();return;}
      document.getElementById('who').textContent=user.displayName?`${user.displayName} · ${user.email||''}`:(user.email||'your account');
      checking.style.display='none';gate.style.display='block';
    });
    btn.addEventListener('click',async()=>{
      btn.disabled=true;status.className='status';status.textContent='Signing you out…';signingOut=true;
      try{
        await signOut(auth);
        localStorage.removeItem('sawsana_guest');
        status.className='status ok';status.textContent='You\'ve been logged out. See you soon!';
        setTimeout(toLogin,900);
      }catch(e){signingOut=false;btn.disabled=false;status.textContent='Could not log out. Please try again.';}
    });
  }catch(e){toLogin();}
}
</script>
</body>
</html>
